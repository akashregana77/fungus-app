services:
  - type: web
    name: fungus-millet-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: MIN_CONFIDENCE
        value: 0.90
      - key: MIN_LOGIT
        value: 0
      - key: MIN_TEXTURE
        value: 9.0
